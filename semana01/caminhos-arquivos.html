<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Caminhos de Arquivos</title>
</head>

<body>
    <!-- 1. Imagem na subpasta "imagens" do diretório atual -->
    <p>Um arquivo de imagem de templo na subpasta imagens:</p>
    <img src="imagens/templo-aba-nigeria.jpeg" alt="O Templo de Aba Nigéria">

    <!-- 2. Imagem na pasta "imagens" na raiz (subindo um nível com ../) -->
    <p>Um arquivo de imagem de templo na pasta raiz imagens:</p>
    <img src="../imagens/templo-lago-salgado.jpg" alt="O Templo de Lago Salgado">

    <!-- 3. Imagem via URL externa (Caminho Absoluto) -->
    <p>Um arquivo de imagem de templo com caminho absoluto:</p>
    <img
      src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/anchorage-alaska/320x180/anchorage-temple-lds-253274-wallpaper.jpg"
      alt="O Templo de Anchorage Alaska">
</body>

</html>
